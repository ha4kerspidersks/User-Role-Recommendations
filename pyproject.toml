[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "user-role-recommendations"
version = "1.0.0"
description = "Enterprise IAM Least-Privilege Role Mining and Entitlement Recommendation Engine"
readme = "README.md"
authors = [
    { name = "Subhajit Kar" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "iam",
    "rbac",
    "role-mining",
    "least-privilege",
    "identity-governance",
    "tf-idf",
    "scikit-learn"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "scikit-learn>=1.0.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "tabulate>=0.8.9",
    "faker>=18.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
role-recommendation = "role_recommendation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
